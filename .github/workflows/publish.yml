name: Build & Publish

# On every pull request this builds the package and runs the tests as a merge
# gate. Every push to staging publishes a pre-release to TestPyPI, and a
# published GitHub Release pushes to PyPI. Both use Trusted Publishing (OIDC),
# so no API tokens are stored anywhere.
on:
  pull_request:
  push:
    branches: [staging]
  release:
    types: [published]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Mark as a staging pre-release
        # TestPyPI never accepts the same version twice, so each staging push
        # publishes <pyproject version>.dev<run number>.
        if: github.event_name == 'push'
        run: >-
          sed -i -E
          's/^version = "([^"]+)"/version = "\1.dev${{ github.run_number }}"/'
          pyproject.toml
      - name: Build distributions
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
