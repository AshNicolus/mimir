name: Build & Publish

# On every pull request this builds the package and runs the tests as a merge
# gate. Every push to staging publishes a pre-release to TestPyPI, and a
# published GitHub Release pushes to PyPI. Both use Trusted Publishing (OIDC),
# so no API tokens are stored anywhere.
on:
  pull_request:
  push:
    branches: [staging]
  release:
    types: [published]

permissions:
  contents: read

# Only PR runs share a group, so a newer push cancels a stale PR run. Staging
# pushes and releases each get their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Mark as a staging pre-release
        # TestPyPI never accepts the same version twice, so each staging push
        # publishes <pyproject version>.dev<run number>.
        if: github.event_name == 'push'
        run: >-
          sed -i -E
          's/^version = "([^"]+)"/version = "\1.dev${{ github.run_number }}"/'
          pyproject.toml
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the wheel
        # Installs the exact wheel that gets published into a fresh venv,
        # outside the checkout, so nothing resolves to src/ or an editable install.
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -m venv /tmp/wheel-env
          cd /tmp
          /tmp/wheel-env/bin/pip install "$wheel"
          /tmp/wheel-env/bin/python -c "
          from mimir import Mimir
          m = Mimir(':memory:')
          m.record('fix a flaky test', 'add a retry', outcome='success')
          assert m.recommend('fix a flaky test').recommended_action == 'add a retry'
          "
          /tmp/wheel-env/bin/mimir-ingest --help
          # mimir-mcp needs the mcp extra; with stdin closed it starts and exits 0.
          /tmp/wheel-env/bin/pip install "$wheel[mcp]"
          MIMIR_DB_PATH=/tmp/smoke.db timeout 60 /tmp/wheel-env/bin/mimir-mcp < /dev/null
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to the MCP Registry
    timeout-minutes: 10
    needs: publish  # the registry checks the release is on PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login, grants the io.github.AshNicolus namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Install mcp-publisher (signature-verified)
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish
        # PyPI's JSON API can lag the upload by a minute, so retry before failing.
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

  publish-testpypi:
    name: Publish to TestPyPI
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
