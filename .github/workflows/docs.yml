name: Docs

# Builds the docs site on every PR and push in strict mode, so a broken link or
# anchor fails the check. Deploys to GitHub Pages only when a release is
# published (or by hand), so the live site always matches what's on PyPI
# rather than unreleased work on main.
on:
  pull_request:
  push:
    branches: [main, staging]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build (strict)
        run: zensical build --clean --strict
      - name: Upload site
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: docs deploy
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
