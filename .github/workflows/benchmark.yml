name: Benchmark

# Runs the same workload on this PR and on its base, on one runner, then posts
# the comparison as a comment on the PR (and to the run summary).
# Informational: never fails the build.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Benchmark PR vs base
        run: |
          cp -r benchmarks /tmp/bench
          python /tmp/bench/run.py > /tmp/head.json
          git checkout -q ${{ github.event.pull_request.base.sha }}
          python /tmp/bench/run.py > /tmp/base.json
          python /tmp/bench/compare.py /tmp/base.json /tmp/head.json > /tmp/bench.md
          cat /tmp/bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        # Forked and Dependabot PRs get a read-only token and can't comment.
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchmark
          path: /tmp/bench.md
