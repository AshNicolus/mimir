# The docs site. Its pages include README.md and PLAYBOOK.md (see docs/), so
# those two files stay the single source of the content.
#
#   pip install -e ".[docs]"
#   zensical serve            # preview at http://localhost:8000
#   zensical build --strict   # what CI runs: broken links or anchors fail

[project]
site_name = "Mimir"
site_description = "Experience-driven memory for autonomous agents: learn from past successes and failures."
site_url = "https://ashnicolus.github.io/mimir/"
repo_url = "https://github.com/AshNicolus/mimir"
repo_name = "AshNicolus/mimir"
copyright = "MIT licensed"
# README.md is the home page: Zensical treats it as the folder index, and the
# Playbook's links to README.md then resolve to it.
nav = [
  { "Home" = "README.md" },
  { "Playbook" = "PLAYBOOK.md" },
  { "Demo notebook" = "https://github.com/AshNicolus/mimir/blob/main/examples/mimir_demo.ipynb" },
  { "PyPI" = "https://pypi.org/project/mimir-learn/" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = { anchor_linenums = true }
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
