[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimir-learn"
version = "0.1.4"
description = "Experience-driven memory for autonomous agents: learn from past successes and failures."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "AshNicolus" }]
keywords = ["agents", "memory", "llm", "experience", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# ruff is pinned so a new release cannot change the lint result under CI.
# Keep this in step with the version the lint job installs in ci.yml.
dev = ["pytest>=8.0", "ruff==0.16.1", "mcp>=2.0"]
# Local semantic search (optional). Keyword recall works without this.
embeddings = ["sentence-transformers>=2.2", "numpy>=1.24"]
# ANN vector index for fast semantic recall. Without it, recall falls back to
# a dependency-free Python cosine scan over stored embeddings.
vector = ["sqlite-vec>=0.1.6"]
# MCP server, so Claude Code, Codex, and other MCP clients share one memory.
mcp = ["mcp>=2.0"]

[project.scripts]
mimir-mcp = "mimir.mcp_server:main"

[project.urls]
Homepage = "https://github.com/AshNicolus/mimir"
Repository = "https://github.com/AshNicolus/mimir"

[tool.hatch.build.targets.wheel]
packages = ["src/mimir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # let tests import the benchmarks package

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly rather than inherited: ruff's defaults change between
# releases, and a linter upgrade should not turn a green build red on its own.
[tool.ruff.lint]
select = [
    "E4",    # imports
    "E7",    # statement style
    "E9",    # syntax and IO errors
    "F",     # pyflakes
    "E501",  # keep lines within line-length above
]
